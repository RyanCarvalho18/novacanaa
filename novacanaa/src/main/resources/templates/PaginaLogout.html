<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout - Sistema controle financeiro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 h-screen flex items-center justify-center">

<div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md text-center">
    <div class="text-green-500 text-6xl mb-4">
        ✓
    </div>
    <h2 class="text-2xl font-bold mb-2 text-gray-800">Sessão Encerrada</h2>
    <p class="text-gray-600 mb-6">Você saiu do sistema com segurança.</p>

    <a th:href="@{/login}"
       class="inline-block bg-blue-600 text-white px-6 py-2 rounded-md hover:bg-blue-700 transition duration-200
  font-semibold">
        Voltar para o Login
    </a>
</div>

</body>
</html>
