<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta | Nova Canaa Financeiro</title>
    <!-- Importando o Tailwind CSS para o design sofisticado -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4"
      style="background-image: radial-gradient(circle at top right, #e2e8f0, transparent), radial-gradient(circle at bottom left, #e2e8f0, transparent);">

<div class="glass max-w-md w-full p-8 rounded-2xl shadow-2xl">
    <!-- Cabeçalho -->
    <div class="text-center mb la-8 mb-8">
        <h1 class="text-3xl font-bold text-slate-800">Bem-vindo!</h1>
        <p class="text-slate-500 mt-2">Crie sua conta para gerenciar suas finanças</p>
    </div>

    <!-- Formulário integrado ao Spring -->
    <form th:action="@{/cadastro}" method="post" class="space-y-5">

        <!-- Campo Usuário -->
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Nome de Usuário</label>
            <input type="text" name="username" required
                   class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all placeholder:text-slate-400"
                   placeholder="Escolha um nome único">
        </div>

        <!-- Campo Email -->
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">E-mail</label>
            <input type="email" name="email" required
                   class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all placeholder:text-slate-400"
                   placeholder="seu@email.com">
        </div>

        <!-- Campo Senha -->
        <div>
            <label class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
            <input type="password" name="password" required
                   class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all placeholder:text-slate-400"
                   placeholder="••••••••">
        </div>

        <!-- Botão de Envio -->
        <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg shadow-lg shadow-blue-200 transition-all transform hover:-translate-y-1 active:scale-95">
            Criar Minha Conta
        </button>
    </form>

    <!-- Rodapé -->
    <div class="mt-8 text-center">
        <p class="text-sm text-slate-600">
            Já possui uma conta?
            <a href="/login" class="text-blue-600 font-semibold hover:underline">Faça login aqui</a>
        </p>
    </div>
</div>

</body>
</html>
