<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Nova Canaa Financeiro</title>
    <!-- Importando o Tailwind CSS para o design sofisticado -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4"
      style="background-image: radial-gradient(circle at top left, #e2e8f0, transparent), radial-gradient(circle at bottom right, #e2e8f0, transparent);">

<div class="glass max-w-md w-full p-8 rounded-2xl shadow-2xl">
    <!-- Cabeçalho -->
    <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-full mb-4 shadow-lg shadow-blue-200">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
        </div>
        <h1 class="text-3xl font-bold text-slate-800">Bem-vindo de volta!</h1>
        <p class="text-slate-500 mt-2">Entre na sua conta para acessar suas finanças</p>
    </div>

    <!-- Formulário de Login integrado ao Spring Security -->
    <form th:action="@{/login}" method="post" class="space-y-5">

        <!-- Campo Usuário -->
        <div class="space-y-1">
            <label class="block text-sm font-medium text-slate-700">Nome de Usuário</label>
            <input type="text" name="username" required
                   class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all placeholder:text-slate-400"
                   placeholder="Seu usuário">
        </div>

        <!-- Campo Senha -->
        <div class="space-y-1">
            <div class="flex justify-between items-center">
                <label class="block text-sm font-medium text-slate-700">Senha</label>
                <a href="/forgot-password" class="text-xs text-blue-600 hover:underline">Esqueceu a senha?</a>
            </div>
            <input type="password" name="password" required
                   class="w-full px-4 py-3 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none transition-all placeholder:text-slate-400"
                   placeholder="••••••••">
        </div>

        <!-- Lembre-se de mim (Integrado com o .rememberMe do Security) -->
        <div class="flex items-center">
            <input type="checkbox" name="remember-me" id="remember-me"
                   class="w-4 h-4 text-blue-600 border-slate-300 rounded focus:ring-blue-500">
            <label for="remember-me" class="ml-2 text-sm text-slate-600 cursor-pointer">Lembrar de mim</label>
        </div>

        <!-- Botão de Login -->
        <button type="submit"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg shadow-lg shadow-blue-200 transition-all transform hover:-translate-y-1 active:scale-95">
            Entrar no Sistema
        </button>
    </form>

    <!-- Rodapé -->
    <div class="mt-8 text-center">
        <p class="text-sm text-slate-600">
            Ainda não tem uma conta?
            <a href="/cadastro" class="text-blue-600 font-semibold hover:underline">Crie uma agora</a>
        </p>
    </div>
</div>

</body>
</html>
