# ===================================================================
# CONFIGURAÇÕES DE PRODUÇÃO (RAILWAY - POSTGRESQL)
# ===================================================================
spring.application.name=novacanaa

# As variáveis abaixo são preenchidas automaticamente pelo Railway
spring.datasource.url=jdbc:postgresql://${SPRING_DATASOURCE_HOST}:${SPRING_DATASOURCE_PORT}/${SPRING_DATASOURCE_DATABASE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# Segurança e Performance
spring.h2.console.enabled=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway ativado para gerenciar tabelas em produção
spring.flyway.enabled=true
